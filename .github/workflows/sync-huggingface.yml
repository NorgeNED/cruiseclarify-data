name: Sync to Hugging Face

# Mirrors the public dataset files to the Hugging Face dataset
# (CruiseClarify/cruise-costs) whenever they change on main.
# Auth: add an HF *write* token as a repo secret named HF_TOKEN
#       (Settings -> Secrets and variables -> Actions -> New repository secret).
# Manual run: Actions tab -> "Sync to Hugging Face" -> Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'cruise-costs.json'
      - 'cruise-costs.csv'
      - 'cruise-packages.csv'
      - 'cruise-gratuities-tiers.csv'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: hf-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: pip install -U "huggingface_hub[cli]"

      - name: Upload public files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add an HF write token as a repo secret named HF_TOKEN."
            exit 1
          fi

          # huggingface_hub renamed its command-line tool from `huggingface-cli`
          # to `hf`. This step installs the LATEST library every run, so pinning
          # to either name breaks the day upstream changes it — the sync sat
          # broken for three weeks in Aug 2026 for exactly this reason. Pick
          # whichever exists, and say which one, so a future failure is readable.
          if command -v hf >/dev/null 2>&1; then
            HF_CLI="hf"
          elif command -v huggingface-cli >/dev/null 2>&1; then
            HF_CLI="huggingface-cli"
          else
            echo "::error::Neither 'hf' nor 'huggingface-cli' is on PATH after install."
            pip show huggingface_hub || true
            exit 1
          fi
          echo "Using CLI: $HF_CLI ($(pip show huggingface_hub | grep -i '^Version' || true))"

          # Confirm the token authenticates before attempting the upload, so an
          # auth problem reports as an auth problem rather than a failed upload.
          $HF_CLI auth whoami 2>/dev/null || $HF_CLI whoami || {
            echo "::error::HF_TOKEN did not authenticate. Check the token is a WRITE token owned by the account that owns CruiseClarify/cruise-costs."
            exit 1
          }

          $HF_CLI upload CruiseClarify/cruise-costs . . \
            --repo-type dataset \
            --include "cruise-costs.json" "cruise-costs.csv" "cruise-packages.csv" "cruise-gratuities-tiers.csv" "README.md" "LICENSE" \
            --commit-message "Sync from GitHub ${GITHUB_SHA}"
